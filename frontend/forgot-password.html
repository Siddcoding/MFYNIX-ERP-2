<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password - Mfynix</title>
<link rel="icon" type="image/png" href="img/favicon.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand"><img src="img/mfynix-logo.png" alt="Mfynix" /></div>
      <p class="sub" id="cardSub">Enter your email and we'll send a 6-digit verification code.</p>

      <!-- Step 1: enter email, request a code -->
      <form id="requestForm">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="you@company.com" required />
        </div>
        <button class="btn" type="submit" id="requestBtn" data-loading-text="Sending…">Send verification code</button>
      </form>

      <!-- Step 2: enter the code, verify it -->
      <form id="codeForm" style="display:none;">
        <div class="field">
          <label for="code">6-digit code from your email</label>
          <input id="code" name="code" inputmode="numeric" maxlength="6" placeholder="••••••" required style="letter-spacing:.4em;text-align:center;font-size:1.2rem;" />
        </div>
        <button class="btn" type="submit" id="codeBtn" data-loading-text="Verifying…">Verify code</button>
        <div class="aux-row" style="margin-top:10px;"><a href="#" id="resendLink">Resend code</a></div>
      </form>

      <!-- Step 3: set a new password -->
      <form id="resetForm" style="display:none;">
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter it" required minlength="8" />
        </div>
        <button class="btn" type="submit" id="resetBtn" data-loading-text="Saving…">Set new password</button>
      </form>

      <a href="index.html" class="back-link">&larr; Back to login</a>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    initAuroraBackground();
    const requestForm = document.getElementById('requestForm');
    const codeForm = document.getElementById('codeForm');
    const resetForm = document.getElementById('resetForm');
    let email = '';
    let verifiedCode = '';

    function show(form, sub) {
      [requestForm, codeForm, resetForm].forEach(f => f.style.display = f === form ? 'block' : 'none');
      document.getElementById('cardSub').textContent = sub;
    }

    async function requestCode() {
      const data = await api('/auth/forgot-password', { method: 'POST', body: { email } });
      toast(data.message, 'success', 4000);
      if (data.delivered === false) {
        toast('No email provider is set up yet — ask your admin, or check the server log for the code (testing only).', 'info', 7000);
      }
    }

    requestForm.addEventListener('submit', (e) => {
      e.preventDefault();
      withLoading(document.getElementById('requestBtn'), async () => {
        email = document.getElementById('email').value.trim();
        try {
          await requestCode();
          show(codeForm, `If an account exists for ${esc(email)}, a 6-digit code was sent to it. Enter it below.`);
        } catch (err) { toast(err.message, 'error'); }
      })();
    });

    document.getElementById('resendLink').addEventListener('click', (e) => {
      e.preventDefault();
      requestCode().catch(err => toast(err.message, 'error'));
    });

    codeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      withLoading(document.getElementById('codeBtn'), async () => {
        const code = document.getElementById('code').value.trim();
        try {
          await api('/auth/verify-reset-code', { method: 'POST', body: { email, code } });
          verifiedCode = code;
          show(resetForm, 'Code verified. Choose a new password.');
        } catch (err) { toast(err.message, 'error'); }
      })();
    });

    resetForm.addEventListener('submit', (e) => {
      e.preventDefault();
      withLoading(document.getElementById('resetBtn'), async () => {
        const newPassword = document.getElementById('newPassword').value;
        if (newPassword !== document.getElementById('confirmPassword').value) return toast('The two passwords do not match.', 'error');
        try {
          const data = await api('/auth/reset-password', { method: 'POST', body: { email, code: verifiedCode, newPassword } });
          toast(data.message, 'success', 2500);
          setTimeout(() => { window.location.href = 'index.html'; }, 900);
        } catch (err) { toast(err.message, 'error'); }
      })();
    });
  </script>
</body>
</html>
